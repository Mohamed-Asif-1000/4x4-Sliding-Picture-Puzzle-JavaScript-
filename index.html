<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>4x4 Picture Puzzle Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Game Card is below-->
    <div class="card">
        <h1>Picture Puzzle 4×4</h1>
        <div id="puzzleBoard"></div>
        <div id="reference">
            <h3>Reference Image:</h3>
            <img src="cat3.jpg" alt="Reference" id="referenceImg">
        </div>

        <div class="button-container">
            <button id="shuffleBtn">Shuffle</button>
            <button id="resetBtn">Reset</button>
        </div>
        <div id="message"></div>
        <div id="movesCounter">Moves: 0</div>
    </div>
    <!-- javascript file for the game-->
    <script src="main.js"></script>
</body>
</html>
